# =============================================================================
# Readit - Full stack (infra + app)
# =============================================================================
#   - PostgreSQL : primary database
#   - Redis      : cache / CQRS materialised feed views / session store
#   - Kafka      : event streaming
#   - Zookeeper  : coordination service required by Kafka in this version
#   - app        : the Spring Boot + Vaadin application itself
#
# Usage:
#   mvn "spring-boot:build-image" "-Dspring-boot.build-image.imageName=readit-app" "-Dvaadin.productionMode=true"
#   docker compose up -d                 # start everything, including the app
#   docker compose ps                    # check status / health
#   docker compose --profile tools up -d # also start the Kafka UI (port 8081)
#   docker compose down                  # stop (keeps data)
#   docker compose down -v               # stop and wipe all data volumes
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Zookeeper - coordination service for Kafka
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.0
    container_name: readit-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    networks:
      - readit-net

  # ---------------------------------------------------------------------------
  # Kafka - event streaming broker
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.9.0
    container_name: readit-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - readit-net

  # ---------------------------------------------------------------------------
  # PostgreSQL - primary relational database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: readit-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-readit}
      POSTGRES_USER: ${POSTGRES_USER:-readit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-readit}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-readit} -d ${POSTGRES_DB:-readit}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - readit-net

  # ---------------------------------------------------------------------------
  # Redis - cache, CQRS feed views, session store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: readit-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - redis-data:/data
    networks:
      - readit-net

  # ---------------------------------------------------------------------------
  # app - the Spring Boot + Vaadin application
  # ---------------------------------------------------------------------------
  # Built separately via:
  #   mvn "spring-boot:build-image" "-Dspring-boot.build-image.imageName=readit-app" "-Dvaadin.productionMode=true"
  # This produces a local image called readit-app, which this service just runs.
  # ---------------------------------------------------------------------------
  app:
    image: readit-app
    container_name: readit-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - delta-lake-data:/workspace/delta-lake
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-readit}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-readit}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-readit}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      VAADIN_PRODUCTION_MODE: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0"
    networks:
      - readit-net

  # ---------------------------------------------------------------------------
  # Kafka UI (OPTIONAL) - web dashboard to inspect topics, messages, consumers
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: readit-kafka-ui
    profiles: ["tools"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: readit-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - readit-net

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  postgres-data:
  redis-data:
  delta-lake-data:

networks:
  readit-net:
    driver: bridge
